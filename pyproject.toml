[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adsense-site-auditor"
version = "0.1.0"
description = "Deterministic checks behind the AdSense site readiness audit skill"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# Só `adsense_checks` é pacote. `templates/` e `references/` são dados em Markdown
# e `scripts/` são CLIs executados por caminho, nunca importados por outro pacote.
# Sem esta lista, a descoberta flat-layout do setuptools enxerga três diretórios
# importáveis e recusa o build inteiro — `uv pip install -e .`, documentado em
# scripts/README.md, falhava com "Multiple top-level packages discovered".
[tool.setuptools]
packages = ["adsense_checks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Os scripts vivem em scripts/ e são importados pelos testes como módulos.
pythonpath = ["scripts", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
