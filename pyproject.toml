[project]
name = "adsense-site-auditor"
version = "0.1.0"
description = "Deterministic checks behind the AdSense site readiness audit skill"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Os scripts vivem em scripts/ e são importados pelos testes como módulos.
pythonpath = ["scripts", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
